<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fafbf8">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body{% if page.layout == 'post' %} class="article-page"{% endif %}>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="fanjinsong 首页"><span class="brand-mark" aria-hidden="true">f.</span><span>fanjinsong</span></a>
      <div class="header-actions">
        <a class="header-link" href="{{ '/' | relative_url }}#notes">文章</a>
        <a class="header-link" href="https://github.com/fanjinsong" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span><span class="visually-hidden">（在新标签页打开）</span></a>
        <button class="icon-button theme-toggle" type="button" aria-label="切换到深色主题" aria-pressed="false" title="切换主题">
          <svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.7 8.7 0 0 1 10.5 3 8.7 8.7 0 1 0 20.5 13.5Z"/></svg>
          <svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="shell{% if page.layout == 'post' %} article-layout{% endif %}">{{ content }}</main>
  <footer class="site-footer shell"><p>© <span data-year>{{ site.time | date: '%Y' }}</span> fanjinsong · 技术笔记</p><a href="https://github.com/fanjinsong/fanjinsong.github.io" target="_blank" rel="noopener noreferrer">本站源码 <span aria-hidden="true">↗</span><span class="visually-hidden">（在新标签页打开）</span></a></footer>
</body>
</html>
